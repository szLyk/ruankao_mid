<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",-apple-system,sans-serif;line-height:1.65;color:#0f172a;background:#f1f5f9;padding-bottom:60px}
header{position:sticky;top:0;z-index:9;background:#1e3a5f;color:#fff;padding:12px 16px}

.hbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}

#sheet button{border:1px solid #cbd5e1;border-radius:7px;padding:5px 0;cursor:pointer;font-size:12.5px;background:#fff}

.qhead b{font-size:14px}.mtag{font-size:11.5px;color:#64748b;background:#f1f5f9;border-radius:10px;padding:2px 9px}
.mkbtn{border:none;background:none;cursor:pointer;font-size:14px;color:#94a3b8}
.mkbtn.on{color:#dc2626}
.qt{font-size:14px;margin-bottom:8px;white-space:pre-wrap}
.opt{border:1px solid #e2e8f0;border-radius:9px;padding:7px 11px;margin:5px 0;font-size:13.5px;cursor:pointer}
.opt:hover{border-color:#1d4ed8}
.opt.sel{background:#dbeafe;border-color:#1d4ed8;font-weight:600}

.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:13.5px}

#result .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px}

.score{font-size:34px;font-weight:800;color:#1d4ed8}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}

.wq{border-left:3px solid #dc2626;padding-left:10px;margin:9px 0;font-size:13.5px}

<header>
 <h1>📄 全真模拟卷 · 基础知识 75 题（按考纲分值组卷）</h1>

</div>
<script>
const SETS = [[{"mod":"os","q":"三个作业同时到达，运行时间分别为 8、4、2 分钟，按短作业优先（SJF）调度，平均周转时间为（  ）分钟。","o":["11.33","8","14","7.33"],"ans":"D","exp":"SJF 顺序 2→4→8，完成时间 2、6、14，周转=完成−到达(0)，平均 (2+6+14)/3≈7.33；A 是 FCFS 的 (8+12+14)/3——这就是\"SJF 平均周转最小\"的活例子。"},{"mod":"db","q":"事务的隔离性是指（  ）。","o":["全做或全不做","事务之间互不干扰，并发执行的总效果与按某种顺序串行执行等价","提交后永久生效","状态一致"],"ans":"B","exp":"A=原子性，C=持续性，D=一致性。“与串行执行等价”即<b>可串行化</b>：物理上同时在跑，但结果必须等价于排队执行（否则就会出现并发四问题）；靠锁+两段锁协议实现（见题17）。"},{"mod":"pl","q":"关于解释方式执行高级语言程序，正确的是（  ）。","o":["生成可脱离解释器运行的目标程序","执行效率一定高于编译方式","不生成独立的目标程序，逐句翻译并立即执行","完全不做语法检查"],"ans":"C","exp":"解释=边翻译边执行、便于跨平台；A 是编译的特点，B 反了（解释通常更慢）。"},{"mod":"net","q":"ARP 协议的作用是（  ）。","o":["IP 地址→MAC 地址","域名→IP","MAC→IP","自动分配 IP"],"ans":"A","exp":"域名→IP 是 DNS；自动分配是 DHCP。"},{"mod":"ds","q":"稀疏图更适合的存储结构是（  ）。","o":["邻接矩阵","邻接表","逆邻接矩阵","三元组只能用于矩阵"],"ans":"B","exp":"邻接表 n+e 空间，稀疏图 e≪n²。"},{"mod":"os","q":"分时系统主要采用（ ）调度以保证响应时间。","o":["时间片轮转","先来先服务","短作业优先","优先级非抢占"],"ans":"A","exp":"轮转让交互用户都及时获得 CPU。"},{"mod":"sw","q":"软件需求规格说明书 SRS 是（  ）阶段的产物。","o":["需求定义（需求开发）","概要设计","编码","测试"],"ans":"A","exp":"需求定义阶段输出 SRS，是设计、测试的依据。"},{"mod":"sw","q":"软件缺陷修复后，重新执行原有测试以确认未引入新缺陷，称为（  ）。","o":["冒烟测试","回归测试","确认测试","集成测试"],"ans":"B","exp":"回归=变更后再验证。"},{"mod":"sw","q":"内聚程度最低（最差）的是（  ）。","o":["偶然内聚","逻辑内聚","时间内聚","功能内聚"],"ans":"A","exp":"偶然内聚=毫无关系凑一起（复制粘贴代码），最差；功能内聚最好。"},{"mod":"comp","q":"DMA 方式中，DMA 控制器每挪用一个总线周期传送一个数据的传送方式称为（  ）。","o":["停止 CPU 访问主存","周期挪用（周期窃取）","与 CPU 交替访问","程序查询"],"ans":"B","exp":"<b>周期挪用</b>：DMA 挪用一个总线周期传一个数据，CPU 该周期让出——既不停死 CPU 又能成块直传。"},{"mod":"os","q":"SPOOLing 技术的主要作用是（  ）。","o":["把打印机等独占设备改造成可共享的虚拟设备","提高 CPU 主频","压缩磁盘空间","加密打印内容"],"ans":"A","exp":"用磁盘做缓冲排队，多用户\"同时\"打印实际是磁盘缓冲+逐个输出。"},{"mod":"pl","q":"表达式 a+b*c 的前缀式（波兰式）是（  ）。","o":["abc*+","+a*bc","ab+c*","a*bc+"],"ans":"B","exp":"前缀式运算符前置：先 * 后 + → + a * b c；后缀式才是 abc*+。"},{"mod":"pl","q":"某 DFA 只有状态 S（初态）与 A（终态），转换：S—a→A，S—b→S，A—a→A，A—b→S。它接受的字符串集合是（  ）。","o":["所有以 a 结尾的字符串","所有以 b 结尾的字符串","所有以 a 开头的字符串","所有含偶数个 a 的字符串"],"ans":"A","exp":"读到 a   for(let k = 0; k < 4; k++){
    const e = document.getElementById('o' + i + '_' + k);
    if(e) e.className = 'opt' + (answers[i] === j && k === j ? ' sel' : '');
  }
  updateSheet();
};
window.mark = function(i){ marked.has(i) ? marked.delete(i) : marked.add(i);
  document.getElementById('mk' + i).className = 'mkbtn' + (marked.has(i) ? ' on' : ''); updateSheet(); };
window.goto = function(i){ document.getElementById('qc' + i).scrollIntoView({behavior: 'smooth', block: 'start'}); };
function updateSheet(){
  const qs = SETS[cur];
  document.getElementById('sheet').innerHTML = qs.map((q, i) => {
    const cls = (answers[i] !== undefined ? 'done' : '') + (marked.has(i) ? ' mk' : '');
    return '<button class="' + cls + '" onclick="goto(' + i + ')">' + (i+1) + '</button>';
  }).join('');
}
function tick(){
  const m = String(Math.floor(left / 60)).padStart(2, '0'), s = String(left % 60).padStart(2, '0');
  const c = document.getElementById('clock');
  c.textContent = m + ':' + s;
  c.className = left <= 600 ? 'low' : '';
  if(left <= 0){ clearInterval(timer); if(!submitted) submit(); }
  left--;
}
window.submit = function(){
  if(submitted) return;
  submitted = true; clearInterval(timer);
  const qs = SETS[cur];
  let right = 0; const mod = {}, wrong = [], un = [];
  qs.forEach((q, i) => {
    mod[q.mod] = mod[q.mod] || {n: 0, r: 0}; mod[q.mod].n++;
    const a = answers[i];
    if(a !== undefined && 'ABCD'[a] === q.ans){ right++; mod[q.mod].r++; }
    else (a === undefined ? un : wrong).push({i, q, a});
  });
  const pct = Math.round(right / qs.length * 100);
  const pass = pct >= 52 ? '🏆 过线水准（目标 52+）' : (pct >= 45 ? '⚠ 距过线还有 ' + (52 - pct) + ' 分，优先清错题' : '🔴 需系统回课件补模块');
  document.getElementById('exam').classList.add('hide');
  const r = document.getElementById('result');
  r.classList.remove('hide');
  let h = '<div class="card"><h2>📊 成绩（' + ['套一','套二','套三'][cur] + '）</h2>'
    + '<span class="score">' + right + ' / ' + qs.length + '</span>　<span style="font-size:15px">折合 ' + pct + ' 分</span>　' + pass
    + '<table><tr><th>模块</th><th>正确 / 题数</th><th>正确率</th></tr>'
    + Object.keys(mod).map(k => '<tr><td>' + MOD[k] + '</td><td>' + mod[k].r + ' / ' + mod[k].n + '</td><td>' + Math.round(mod[k].r / mod[k].n * 100) + '%</td></tr>').join('')
    + '</table><div style="font-size:12.5px;color:#64748b;margin-top:6px">最弱模块直接回对应课件页签：软件工程25 / 数据结构28 / 数据库27 / 操作系统26 / 组成29 / 网络24+22 / 程序语言30</div></div>';
  if(un.length) h += '<div class="card"><h2>⬜ 未作答 ' + un.length + ' 题</h2>' + un.map(w => '<div class="wq">第 ' + (w.i+1) + ' 题（' + MOD[w.q.mod] + '）——机考没有空白分，哪怕蒙也要选</div>').join('') + '</div>';
  h += '<div class="card"><h2>✘ 错题解析 ' + wrong.length + ' 道</h2>'
    + wrong.map(w => '<div class="wq"><b>第 ' + (w.i+1) + ' 题（' + MOD[w.q.mod] + '）</b> ' + w.q.q
      + '<br>我答 <span class="m">' + (w.a === undefined ? '未作答' : 'ABCD'[w.a]) + '</span> ｜ 正确 <span class="r">' + w.q.ans + '</span>'
      + '<div class="exp">' + (w.q.exp || '') + '</div></div>').join('')
    + '</div>';
  h += '<div class="card"><button class="btn pri" onclick="pickSet(' + cur + ')">↺ 重做本套</button> <button class="btn" onclick="pickSet(' + ((cur+1)%3) + ')">换一套 →</button></div>';
  r.innerHTML = h;
  window.scrollTo({top: 0, behavior: 'smooth'});
};
pickSet(0);
</script>
</body>
