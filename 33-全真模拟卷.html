  document.getElementById('exam').classList.remove('hide');
  ['s0','s1','s2'].forEach((id, k) => document.getElementById(id).className = k === i ? 'on' : '');
  clearInterval(timer); timer = setInterval(tick, 1000); tick();
  render(); updateSheet();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function render(){
  const qs = SETS[cur];
  document.getElementById('qlist').innerHTML = qs.map((q, i) =>
    '<div class="qcard" id="qc' + i + '"><div class="qhead"><b>第 ' + (i+1) + ' 题</b>'
    + '<span><span class="mtag">' + MOD[q.mod] + '</span> '
    + '<button class="mkbtn" id="mk' + i + '" onclick="mark(' + i + ')">⚑</button></span></div>'
    + '<div class="qt">' + esc(q.q) + '</div>'
    + q.o.map((o, j) => '<div class="opt" id="o' + i + '_' + j + '" onclick="choose(' + i + ',' + j + ')"><b>' + 'ABCD'[j] + '.</b> ' + esc(o) + '</div>').join('')
    + '</div>').join('');
}
window.choose = function(i, j){
  if(submitted) return;
  answers[i] = (answers[i] === j) ? undefined : j;
  if(answers[i] === undefined) delete answers[i];
  for(let k = 0; k < 4; k++){
    const e = document.getElementById('o' + i + '_' + k);
    if(e) e.className = 'opt' + (answers[i] === j && k === j ? ' sel' : '');
  }
  updateSheet();
};
window.mark = function(i){ marked.has(i) ? marked.delete(i) : marked.add(i);
  document.getElementById('mk' + i).className = 'mkbtn' + (marked.has(i) ? ' on' : ''); updateSheet(); };
window.goto = function(i){ document.getElementById('qc' + i).scrollIntoView({behavior: 'smooth', block: 'start'}); };
function updateSheet(){
  const qs = SETS[cur];
  document.getElementById('sheet').innerHTML = qs.map((q, i) => {
    const cls = (answers[i] !== undefined ? 'done' : '') + (marked.has(i) ? ' mk' : '');
    return '<button class="' + cls + '" onclick="goto(' + i + ')">' + (i+1) + '</button>';
  }).join('');
}
function tick(){
  const m = String(Math.floor(left / 60)).padStart(2, '0'), s = String(left % 60).padStart(2, '0');
  const c = document.getElementById('clock');
  c.textContent = m + ':' + s;
  c.className = left <= 600 ? 'low' : '';
  if(left <= 0){ clearInterval(timer); if(!submitted) submit(); }
  left--;
}
window.submit = function(){
  if(submitted) return;
  submitted = true; clearInterval(timer);
  const qs = SETS[cur];
  let right = 0; const mod = {}, wrong = [], un = [];
  qs.forEach((q, i) => {
    mod[q.mod] = mod[q.mod] || {n: 0, r: 0}; mod[q.mod].n++;
    const a = answers[i];
    if(a !== undefined && 'ABCD'[a] === q.ans){ right++; mod[q.mod].r++; }
    else (a === undefined ? un : wrong).push({i, q, a});
  });
  const pct = Math.round(right / qs.length * 100);
  const pass = pct >= 52 ? '🏆 过线水准（目标 52+）' : (pct >= 45 ? '⚠ 距过线还有 ' + (52 - pct) + ' 分，优先清错题' : '🔴 需系统回课件补模块');
  document.getElementById('exam').classList.add('hide');
  const r = document.getElementById('result');
  r.classList.remove('hide');
  let h = '<div class="card"><h2>📊 成绩（' + ['套一','套二','套三'][cur] + '）</h2>'
    + '<span class="score">' + right + ' / ' + qs.length + '</span>　<span style="font-size:15px">折合 ' + pct + ' 分</span>　' + pass
    + '<table><tr><th>模块</th><th>正确 / 题数</th><th>正确率</th></tr>'
    + Object.keys(mod).map(k => '<tr><td>' + MOD[k] + '</td><td>' + mod[k].r + ' / ' + mod[k].n + '</td><td>' + Math.round(mod[k].r / mod[k].n * 100) + '%</td></tr>').join('')
    + '</table><div style="font-size:12.5px;color:#64748b;margin-top:6px">最弱模块直接回对应课件页签：软件工程25 / 数据结构28 / 数据库27 / 操作系统26 / 组成29 / 网络24+22 / 程序语言30</div></div>';
  if(un.length) h += '<div class="card"><h2>⬜ 未作答 ' + un.length + ' 题</h2>' + un.map(w => '<div class="wq">第 ' + (w.i+1) + ' 题（' + MOD[w.q.mod] + '）——机考没有空白分，哪怕蒙也要选</div>').join('') + '</div>';
  h += '<div class="card"><h2>✘ 错题解析 ' + wrong.length + ' 道</h2>'
    + wrong.map(w => '<div class="wq"><b>第 ' + (w.i+1) + ' 题（' + MOD[w.q.mod] + '）</b> ' + w.q.q
      + '<br>我答 <span class="m">' + (w.a === undefined ? '未作答' : 'ABCD'[w.a]) + '</span> ｜ 正确 <span class="r">' + w.q.ans + '</span>'
      + '<div class="exp">' + restoreB(esc(w.q.exp || '')) + '</div></div>').join('')
    + '</div>';
  h += '<div class="card"><button class="btn pri" onclick="pickSet(' + cur + ')">↺ 重做本套</button> <button class="btn" onclick="pickSet(' + ((cur+1)%3) + ')">换一套 →</button></div>';
  r.innerHTML = h;
  window.scrollTo({top: 0, behavior: 'smooth'});
};
pickSet(0);
</script>
</body>
</html>
